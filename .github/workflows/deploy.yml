name: Deploy to Server

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. 部署主代码仓库（公开仓库）
            if [ ! -d /root/FurryReadingBot ]; then
              echo "首次部署，正在克隆代码仓库..."
              git clone -b deploy https://github.com/DowneyRem/FurryReadingBot.git /root/FurryReadingBot
            fi

            cd /root/FurryReadingBot
            git fetch origin deploy
            git reset --hard origin/deploy

            # 2. 部署/同步运营数据仓库（私有仓库）
            DATA_DIR="/root/FurryReadingBot/data"
            PRIVATE_REPO="${{ secrets.PRIVATE_REPO }}"
            PRIVATE_REPO_URL="https://oauth2:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git"

            if [ ! -d "$DATA_DIR/.git" ]; then
              echo "data 目录不存在或不是一个 Git 仓库，正在重新克隆私有数据仓库..."
              rm -rf "$DATA_DIR"
              git clone "$PRIVATE_REPO_URL" "$DATA_DIR"
            else
              echo "更新私有数据仓库..."
              cd "$DATA_DIR"
              git pull origin main --force
              cd /root/FurryReadingBot
            fi

            # 3. 安装并配置 uv 环境
            if ! command -v uv &> /dev/null; then
              echo "正在安装 uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi

            export PATH="/root/.local/bin:$PATH"
            uv sync

            # 4. 自动生成 .env
            cat > .env << EOF
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            FURRY_READING=${{ secrets.FURRY_READING }}
            FURRY_NOVELS=${{ secrets.FURRY_NOVELS }}
            TEST_CHANNEL=${{ secrets.TEST_CHANNEL }}
            TRANSIT_CHANNEL=${{ secrets.TRANSIT_CHANNEL }}
            FURRY_READING_NEW_GROUP=${{ secrets.FURRY_READING_NEW_GROUP }}
            TEST_GROUP=${{ secrets.TEST_GROUP }}

            SHARE_MODE=test
            SHARE_SCORE_THRESHOLD=7
            SHARE_COOLDOWN_DAYS=3
            FILE_CACHE_TTL_DAYS=7
            EOF

            # 5. 安装 / 更新 systemd 服务并重启
            cp deploy/furryreadingbot.service /etc/systemd/system/furryreadingbot.service
            systemctl daemon-reload
            systemctl enable furryreadingbot
            systemctl restart furryreadingbot
