name: Deploy to Server

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

# 连推两次时排队执行，避免两个 runner 同时 git reset / systemctl restart
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # 任一命令失败就中断：避免「装了一半 / 同步失败」也照样重启服务
          script_stop: true
          script: |
            set -euo pipefail

            # 1. 部署主代码仓库（公开仓库）
            if [ ! -d /root/FurryReadingBot ]; then
              echo "首次部署，正在克隆代码仓库..."
              git clone -b deploy https://github.com/DowneyRem/FurryReadingBot.git /root/FurryReadingBot
            fi

            cd /root/FurryReadingBot
            git fetch origin deploy
            git reset --hard origin/deploy


            # 2. 部署/同步运营数据仓库（私有仓库）
            DATA_DIR="/root/FurryReadingBot/data"
            PRIVATE_REPO="${{ secrets.PRIVATE_REPO }}"
            PRIVATE_REPO_URL="https://oauth2:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${PRIVATE_REPO}.git"

            if [ ! -d "$DATA_DIR/.git" ]; then
              echo "data 目录不存在或不是一个 Git 仓库，正在重新克隆私有数据仓库..."
              rm -rf "$DATA_DIR"
              git clone "$PRIVATE_REPO_URL" "$DATA_DIR"
            else
              echo "安全更新私有数据仓库..."
              cd "$DATA_DIR"

              # 抓取远端最新状态，但不自动合并，避免直接污染本地
              git fetch origin main
              # 如果本地有未提交的新数据（Bot刚才写入的），先暂存保护起来
              git stash || true
              # 尝试安全合并远端变动（使用 --ff-only，如果远端有冲突或被别人强改过，拒绝盲目覆盖，报错并中止）
              git merge origin/main --ff-only || {
                echo "警告：远端私有仓库与本地数据存在冲突！放弃自动合并，以服务器本地数据为准。"
                git merge --abort || true
              }

              # 恢复本地的未提交修改
              git stash pop || true
              cd /root/FurryReadingBot
            fi


            # 3. 安装并配置 uv 环境
            if ! command -v uv &> /dev/null; then
              echo "正在安装 uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi

            # uv 装在 $HOME/.local/bin：SSH_USER 是 root 或普通用户都能找到
            export PATH="$HOME/.local/bin:$PATH"
            uv sync


            # 4. 自动生成 .env
            #    只写「部署相关」的 token 与频道 ID；
            #    SHARE_MODE / SHARE_SCORE_THRESHOLD / SHARE_COOLDOWN_DAYS / FILE_CACHE_TTL_DAYS
            #    / CONCURRENT_UPDATES 都是 config.py 里的公开常量，不走 .env。
            #    heredoc 用引号包裹的 'EOF'：避免 secret 里的 $ / 反引号被 shell 再展开一次。
            cat > .env <<'EOF'
            BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
            FURRY_READING="${{ secrets.FURRY_READING }}"
            FURRY_NOVELS="${{ secrets.FURRY_NOVELS }}"
            TEST_CHANNEL="${{ secrets.TEST_CHANNEL }}"
            TRANSIT_CHANNEL="${{ secrets.TRANSIT_CHANNEL }}"
            FURRY_READING_NEW_GROUP="${{ secrets.FURRY_READING_NEW_GROUP }}"
            TEST_GROUP="${{ secrets.TEST_GROUP }}"
            EOF

            # Secret 没配时上面会写成空字符串，进程起来会直接 SystemExit，
            # 这里先拦一次，并和 config.py 里 SHARE_MODE=prod 的必需项对齐。
            for key in BOT_TOKEN FURRY_READING FURRY_NOVELS TEST_CHANNEL; do
              if ! grep -qE "^${key}=\"..*\"" .env; then
                echo "错误：.env 里的 ${key} 为空，请检查仓库 Secrets。"
                exit 1
              fi
            done


            # 5. 安装 / 更新 systemd 服务（机器人 + 数据同步）
            cp deploy/furryreadingbot.service /etc/systemd/system/furryreadingbot.service
            cp deploy/furryreadingbot-sync.service /etc/systemd/system/furryreadingbot-sync.service
            cp deploy/furryreadingbot-sync.timer /etc/systemd/system/furryreadingbot-sync.timer

            systemctl daemon-reload

            # 启用并启动机器人服务
            systemctl enable furryreadingbot
            systemctl restart furryreadingbot

            # 启用数据同步定时器；restart 让改过的 OnCalendar 立即生效
            systemctl enable furryreadingbot-sync.timer
            systemctl restart furryreadingbot-sync.timer

            # 6. 启动校验：配置缺失 / 代码异常会让进程立刻退出，别让 workflow 假装成功
            sleep 5
            if ! systemctl is-active --quiet furryreadingbot; then
              echo "机器人服务启动失败，最近日志："
              journalctl -u furryreadingbot -n 50 --no-pager || true
              exit 1
            fi
            echo "部署完成：furryreadingbot 正在运行。"
