name: Deploy to Server

on:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            if [ ! -d /root/FurryReadingBot ]; then
              echo "首次部署，正在克隆仓库..."
              git clone -b deploy https://github.com/DowneyRem/FurryReadingBot.git /root/FurryReadingBot
            fi

            cd /root/FurryReadingBot
            git fetch origin deploy
            git reset --hard origin/deploy

            # 1. 检查并自动安装 uv（如果服务器上还没有）
            if ! command -v uv &> /dev/null; then
              echo "正在安装 uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi

            # 2. 将 root 用户的 uv 路径加入到当前 SSH 会话的 PATH 中
            export PATH="/root/.local/bin:$PATH"

            # 3. 使用 uv 创建/同步虚拟环境并安装依赖
            # （uv sync 会自动检测 pyproject.toml 并创建 .venv 虚拟环境）
            uv sync

            # 自动生成 .env
            cat > .env << EOF
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            FURRY_READING=${{ secrets.FURRY_READING }}
            FURRY_NOVELS=${{ secrets.FURRY_NOVELS }}
            TEST_CHANNEL=${{ secrets.TEST_CHANNEL }}
            TRANSIT_CHANNEL=${{ secrets.TRANSIT_CHANNEL }}
            FURRY_READING_NEW_GROUP=${{ secrets.FURRY_READING_NEW_GROUP }}
            TEST_GROUP=${{ secrets.TEST_GROUP }}

            # 分享模式：test 只发测试频道；prod 按评分分流到正式频道
            SHARE_MODE=test
            # prod 模式下，评分达到该值的作品同时发到兽人阅读和兽人小说；否则只发兽人小说
            SHARE_SCORE_THRESHOLD=7
            # 分享冷却（天）：同一部作品在该时间内不会重复发送到频道
            SHARE_COOLDOWN_DAYS=3
            # 文件缓存天数：file_id 在该时间内可直接复用
            FILE_CACHE_TTL_DAYS=7
            EOF

            # 安装 / 更新 systemd 服务
            cp deploy/furryreadingbot.service /etc/systemd/system/furryreadingbot.service
            systemctl daemon-reload
            systemctl enable furryreadingbot
            systemctl restart furryreadingbot
