[project]
name = "furryreadingbot"
version = "0.1.0"
description = "把兽人小说打包成 TXT / ZIP 的 Telegram Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "pyzipper>=0.4.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
